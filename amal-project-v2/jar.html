<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jar of Wishes 🫙 أمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back" href="index.html" data-link>← Home</a>

<canvas id="jar"></canvas>

<div class="jarui">
  <button class="pill" id="add">Add a heart 💗</button>
  <button class="pill" id="shake">Shake ✨</button>
  <span class="counter" id="count">0 hearts · tap one to read it</span>
</div>

<div class="note" id="note">
  <div class="card2">
    <div class="heartico">💌</div>
    <div class="en" id="noteEn"></div>
    <div class="arx" id="noteAr" dir="rtl"></div>
    <button id="noteClose">Keep it ❤️</button>
  </div>
</div>

<script src="common.js"></script>
<script src="jar.js"></script>
</body>
</html>
